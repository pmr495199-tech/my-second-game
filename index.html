<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Case Opener</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 90px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        
        /* Верхня панель балансу */
        .header-stats {
            display: flex;
            justify-content: space-between;
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            align-items: center;
        }
        .balance-box {
            font-size: 20px;
            font-weight: 800;
            color: #facc15;
        }
        .earn-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .earn-btn:active {
            transform: scale(0.95);
        }

        /* Список кейсів */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #38bdf8;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .case-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .case-info h4 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .case-info p {
            font-size: 13px;
            color: #94a3b8;
        }
        .open-case-btn {
            background: #facc15;
            color: #78350f;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Вікно рулетки */
        .roulette-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .roulette-window {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .spinner-container {
            width: 100%;
            height: 110px;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin: 20px 0;
            border: 2px solid #334155;
        }
        .spinner-pointer {
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 3px;
            background: #ef4444;
            transform: translateX(-50%);
            z-index: 10;
        }
        .spinner-track {
            display: flex;
            position: absolute;
            left: 0; top: 0;
            height: 100%;
            will-change: transform;
        }
        .spinner-item {
            min-width: 100px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #334155;
            padding: 5px;
        }
        .spinner-item span {
            font-size: 12px;
            margin-top: 4px;
            font-weight: bold;
        }

        /* Кнопка зв'язку з адміном у модалці */
        .claim-btn {
            display: none;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 15px;
            font-size: 14px;
        }

        /* Інвентар */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .inventory-item {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .item-name {
            font-size: 14px;
            font-weight: bold;
            margin: 6px 0;
        }
        .sell-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        /* Нижня панель навігації */
        .nav-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 75px;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #334155;
            max-width: 480px;
            margin: 0 auto;
        }
        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }
        .nav-item.active {
            color: #38bdf8;
        }
        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="content">
        
        <!-- БАЛАНС ЗВЕРХУ -->
        <div class="header-stats">
            <div>
                <div style="font-size: 12px; color: #94a3b8;">Баланс зірок</div>
                <div class="balance-box"><span id="ui-stars">100</span> ⭐</div>
            </div>
            <button class="earn-btn" onclick="earnStars()">+ Безкоштовно</button>
        </div>

        <!-- ВКЛАДКА 1: КЕЙСИ -->
        <div id="tab-cases" class="tab-content active">
            <div class="section-title">Головний кейс</div>
            <div class="cases-grid">
                
                <div class="case-card">
                    <div class="case-info">
                        <h4>🎁 Кейс з призами</h4>
                        <p>Ціна: 20 ⭐</p>
                    </div>
                    <button class="open-case-btn" onclick="openCase()">Відкрити</button>
                </div>

            </div>
        </div>

        <!-- ВКЛАДКА 2: ІНВЕНТАР -->
        <div id="tab-inventory" class="tab-content">
            <div class="section-title">Мій інвентар</div>
            <div class="inventory-grid" id="inventory-list">
                <!-- Сюди додаються призи -->
            </div>
        </div>

    </div>

    <!-- АНІМАЦІЯ РУЛЕТКИ (МОДАЛКА) -->
    <div class="roulette-overlay" id="rouletteOverlay">
        <div class="roulette-window">
            <h3 style="margin-bottom: 10px;">Відкриття кейсу...</h3>
            <div class="spinner-container">
                <div class="spinner-pointer"></div>
                <div class="spinner-track" id="spinnerTrack"></div>
            </div>
            <p id="winResultText" style="font-size: 15px; font-weight: bold; color: #facc15; margin-top: 15px;"></p>
            <a id="claimBtn" class="claim-btn" href="#" target="_blank">📲 Забрати приз у адміна</a>
            <button id="closeModalBtn" style="background: #334155; color: white; border: none; padding: 8px 16px; border-radius: 8px; margin-top: 15px; cursor: pointer; display: none;" onclick="closeOverlay()">Закрити</button>
        </div>
    </div>

    <!-- НИЖНЯ ПАНЕЛЬ НАВІГАЦІЇ -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('cases', this)">
            <span class="nav-icon">🎁</span>
            <span>Кейси</span>
        </button>
        <button class="nav-item" onclick="switchTab('inventory', this)">
            <span class="nav-icon">🏆</span>
            <span>Інвентар</span>
        </button>
    </div>
</div>

<script>
    // ВСТАВ СВІЙ ТЕЛЕГРАМ НІКНЕЙМ ТУТ (без @)
    const ADMIN_USERNAME = "ваш_телеграм_нік";

    let stars = parseInt(localStorage.getItem('case_stars')) || 100;
    let inventory = JSON.parse(localStorage.getItem('case_inventory')) || [];

    // Чіткий список усіх можливих призів
    const allPrizes = [
        { id: 'star5', name: '+5 зірок', color: '#38bdf8', icon: '⭐', type: 'stars', value: 5 },
        { id: 'star10', name: '+10 зірок', color: '#38bdf8', icon: '⭐', type: 'stars', value: 10 },
        { id: 'star15', name: '+15 зірок', color: '#38bdf8', icon: '⭐', type: 'stars', value: 15 },
        { id: 'bear', name: 'Ведмідь', color: '#facc15', icon: '🐻', type: 'item', price: 15 },
        { id: 'heart', name: 'Сердце', color: '#ef4444', icon: '💝', type: 'item', price: 15 },
        { id: 'rocket', name: 'Ракета', color: '#a855f7', icon: '🚀', type: 'item', price: 50 }
    ];

    function updateUI() {
        document.getElementById('ui-stars').innerText = stars;
        localStorage.setItem('case_stars', stars);
        localStorage.setItem('case_inventory', JSON.stringify(inventory));
        renderInventory();
    }

    function earnStars() {
        stars += 10;
        updateUI();
    }

    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        
        document.getElementById('tab-' + tabId).classList.add('active');
        element.classList.add('active');
    }

    function openCase() {
        const casePrice = 20;
        if (stars < casePrice) {
            alert('Недостатньо зірок! Натисніть "+ Безкоштовно".');
            return;
        }

        stars -= casePrice;
        updateUI();

        const overlay = document.getElementById('rouletteOverlay');
        const track = document.getElementById('spinnerTrack');
        const resultText = document.getElementById('winResultText');
        const claimBtn = document.getElementById('claimBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        resultText.innerText = "";
        claimBtn.style.display = 'none';
        closeModalBtn.style.display = 'none';
        overlay.style.display = 'flex';

        // Формуємо стрічку рулетки з випадкових призів
        let generatedItems = [];
        let html = '';
        for (let i = 0; i < 50; i++) {
            let randPrize = allPrizes[Math.floor(Math.random() * allPrizes.length)];
            generatedItems.push(randPrize);
            html += `
                <div class="spinner-item" style="border-color: ${randPrize.color}">
                    <span style="font-size: 28px;">${randPrize.icon}</span>
                    <span style="color: ${randPrize.color}">${randPrize.name}</span>
                </div>
            `;
        }
        track.innerHTML = html;

        // Визначаємо точний виграшний елемент на позиції 42
        let winningIndex = 42;
        let winningItem = generatedItems[winningIndex];

        let itemWidth = 100;
        let centerOffset = (400 / 2) - (itemWidth / 2);
        let targetX = -(winningIndex * itemWidth) + centerOffset + (Math.random() * 60 - 30);

        track.style.transition = 'none';
        track.style.transform = `translateX(0px)`;

        setTimeout(() => {
            track.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
            track.style.transform = `translateX(${targetX}px)`;
        }, 50);

        // Після завершення анімації видаємо суто те, що зупинилося на стрілці
        setTimeout(() => {
            if (winningItem.type === 'stars') {
                stars += winningItem.value;
                updateUI();
                resultText.innerHTML = `Ви виграли: <span style="color:${winningItem.color}">${winningItem.icon} ${winningItem.name}</span> (зараховано на баланс!)`;
            } else {
                let uniqueId = Math.floor(100000 + Math.random() * 900000);
                resultText.innerHTML = `Ви виграли: <span style="color:${winningItem.color}">${winningItem.icon} ${winningItem.name}</span> (додано в інвентар!)`;
                
                inventory.push({
                    name: winningItem.name,
                    icon: winningItem.icon,
                    color: winningItem.color,
                    price: winningItem.price,
                    id: uniqueId
                });
                updateUI();

                let msg = encodeURIComponent(`Привіт! Я виграв у грі приз: ${winningItem.name} (ID: #${uniqueId}). Чекаю на видачу!`);
                claimBtn.href = `https://t.me/${ADMIN_USERNAME}?text=${msg}`;
                claimBtn.style.display = 'inline-block';
            }

            closeModalBtn.style.display = 'inline-block';
        }, 4200);
    }

    function closeOverlay() {
        document.getElementById('rouletteOverlay').style.display = 'none';
    }

    function renderInventory() {
        const list = document.getElementById('inventory-list');
        if (inventory.length === 0) {
            list.innerHTML = `<p style="color: #94a3b8; grid-column: span 2; text-align: center; padding: 20px;">Поки що пусто. Відкрийте кейс!</p>`;
            return;
        }

        list.innerHTML = inventory.map((item, index) => `
            <div class="inventory-item" style="border-color: ${item.color}">
                <span style="font-size: 32px;">${item.icon}</span>
                <div class="item-name" style="color: ${item.color}">${item.name}</div>
                <div style="font-size: 11px; color: #94a3b8;">ID: #${item.id}</div>
                <a href="https://t.me/${ADMIN_USERNAME}?text=${encodeURIComponent(`Привіт! Забираю свій приз: ${item.name} (ID: #${item.id})`)}" target="_blank" style="display:block; background:#2563eb; color:white; text-decoration:none; padding:5px; border-radius:6px; font-size:11px; font-weight:bold; margin-top:5px;">Забрати у адміна</a>
                <button class="sell-btn" onclick="sellItem(${index})">Продати за ${item.price}⭐</button>
            </div>
        `).join('');
    }

    function sellItem(index) {
        stars += inventory[index].price;
        inventory.splice(index, 1);
        updateUI();
    }

    updateUI();
</script>

</body>
</html>
