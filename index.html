<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Case Opener Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 90px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        
        /* Верхня панель балансу */
        .header-stats {
            display: flex;
            justify-content: space-between;
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            align-items: center;
        }
        .balance-box {
            font-size: 20px;
            font-weight: 800;
            color: #facc15;
        }
        .earn-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .earn-btn:active {
            transform: scale(0.95);
        }

        /* Список кейсів */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #38bdf8;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .case-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .case-info h4 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .case-info p {
            font-size: 13px;
            color: #94a3b8;
        }
        .open-case-btn {
            background: #facc15;
            color: #78350f;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .open-case-btn:active {
            opacity: 0.8;
        }

        /* Вікно рулетки */
        .roulette-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .roulette-window {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .spinner-container {
            width: 100%;
            height: 110px;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin: 20px 0;
            border: 2px solid #334155;
        }
        .spinner-pointer {
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 3px;
            background: #ef4444;
            transform: translateX(-50%);
            z-index: 10;
        }
        .spinner-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            will-change: transform;
        }
        .spinner-item {
            min-width: 100px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #334155;
            padding: 5px;
        }
        .spinner-item span {
            font-size: 12px;
            margin-top: 4px;
            font-weight: bold;
        }

        /* Інвентар */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .inventory-item {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .item-name {
            font-size: 14px;
            font-weight: bold;
            margin: 6px 0;
        }
        .sell-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        /* Нижня панель навігації */
        .nav-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 75px;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #334155;
            max-width: 480px;
            margin: 0 auto;
        }
        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }
        .nav-item.active {
            color: #38bdf8;
        }
        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="content">
        
        <!-- БАЛАНС ЗВЕРХУ -->
        <div class="header-stats">
            <div>
                <div style="font-size: 12px; color: #94a3b8;">Баланс</div>
                <div class="balance-box"><span id="ui-money">1000</span> 🪙</div>
            </div>
            <button class="earn-btn" onclick="earnMoney()">+ Заробити</button>
        </div>

        <!-- ВКЛАДКА 1: КЕЙСИ -->
        <div id="tab-cases" class="tab-content active">
            <div class="section-title">Доступні кейси</div>
            <div class="cases-grid">
                
                <div class="case-card">
                    <div class="case-info">
                        <h4>📦 Звичайний кейс</h4>
                        <p>Ціна: 200 🪙</p>
                    </div>
                    <button class="open-case-btn" onclick="openCase('common')">Відкрити</button>
                </div>

                <div class="case-card">
                    <div class="case-info">
                        <h4>💎 Елітний кейс</h4>
                        <p>Ціна: 800 🪙</p>
                    </div>
                    <button class="open-case-btn" onclick="openCase('elite')">Відкрити</button>
                </div>

            </div>
        </div>

        <!-- ВКЛАДКА 2: ІНВЕНТАР -->
        <div id="tab-inventory" class="tab-content">
            <div class="section-title">Мій інвентар</div>
            <div class="inventory-grid" id="inventory-list">
                <!-- Сюди динамічно додаються виграні предмети -->
            </div>
        </div>

    </div>

    <!-- АНІМАЦІЯ РУЛЕТКИ (МОДАЛКА) -->
    <div class="roulette-overlay" id="rouletteOverlay">
        <div class="roulette-window">
            <h3 style="margin-bottom: 10px;">Відкриття кейсу...</h3>
            <div class="spinner-container">
                <div class="spinner-pointer"></div>
                <div class="spinner-track" id="spinnerTrack"></div>
            </div>
            <p id="winResultText" style="font-size: 15px; font-weight: bold; color: #facc15; margin-top: 15px;"></p>
        </div>
    </div>

    <!-- НИЖНЯ ПАНЕЛЬ НАВІГАЦІЇ -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('cases', this)">
            <span class="nav-icon">📦</span>
            <span>Кейси</span>
        </button>
        <button class="nav-item" onclick="switchTab('inventory', this)">
            <span class="nav-icon">🎒</span>
            <span>Інвентар</span>
        </button>
    </div>
</div>

<script>
    // Дані гри
    let money = parseInt(localStorage.getItem('case_money')) || 1000;
    let inventory = JSON.parse(localStorage.getItem('case_inventory')) || [];

    // Предмети для Звичайного кейсу
    const commonItems = [
        { name: "Перука", color: "#94a3b8", price: 50, icon: "🧢" },
        { name: "Ржавий ніж", color: "#94a3b8", price: 120, icon: "🔪" },
        { name: "Пістолет", color: "#38bdf8", price: 300, icon: "🔫" },
        { name: "Кастет", color: "#38bdf8", price: 450, icon: "🥊" },
        { name: "Золотий годинник", color: "#a855f7", price: 900, icon: "⌚" }
    ];

    // Предмети для Елітного кейсу
    const eliteItems = [
        { name: "Тактичний ніж", color: "#38bdf8", price: 400, icon: "🗡️" },
        { name: "Автомат AK", color: "#a855f7", price: 1200, icon: "🔥" },
        { name: "Снайперка", color: "#a855f7", price: 2000, icon: "🎯" },
        { name: "Драконячий клинок", color: "#facc15", price: 5000, icon: "🐉" }
    ];

    function updateUI() {
        document.getElementById('ui-money').innerText = money;
        localStorage.setItem('case_money', money);
        localStorage.setItem('case_inventory', JSON.stringify(inventory));
        renderInventory();
    }

    // Заробіток кліком
    function earnMoney() {
        money += 50;
        updateUI();
    }

    // Перемикання вкладок
    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        
        document.getElementById('tab-' + tabId).classList.add('active');
        element.classList.add('active');
    }

    // Відкриття кейсу
    function openCase(type) {
        const price = type === 'common' ? 200 : 800;
        const itemsList = type === 'common' ? commonItems : eliteItems;

        if (money < price) {
            alert('Недостатньо монет! Натисніть «+ Заробити»');
            return;
        }

        money -= price;
        updateUI();

        const overlay = document.getElementById('rouletteOverlay');
        const track = document.getElementById('spinnerTrack');
        const resultText = document.getElementById('winResultText');
        resultText.innerText = "";
        overlay.style.display = 'flex';

        // Формуємо стрічку рулетки (50 елементів для довгої прокрутки)
        let html = '';
        let generatedItems = [];
        for (let i = 0; i < 50; i++) {
            let randItem = itemsList[Math.floor(Math.random() * itemsList.length)];
            generatedItems.push(randItem);
            html += `
                <div class="spinner-item" style="border-color: ${randItem.color}">
                    <span style="font-size: 28px;">${randItem.icon}</span>
                    <span style="color: ${randItem.color}">${randItem.name}</span>
                </div>
            `;
        }
        track.innerHTML = html;

        // Виграшний елемент буде приблизно на 42-й позиції
        let winningIndex = 42;
        let winningItem = generatedItems[winningIndex];

        // Анімація прокрутки
        let itemWidth = 100; // ширина одного блоку в px
        let centerOffset = (400 / 2) - (itemWidth / 2);
        let targetX = -(winningIndex * itemWidth) + centerOffset + (Math.random() * 60 - 30);

        track.style.transition = 'none';
        track.style.transform = `translateX(0px)`;

        setTimeout(() => {
            track.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
            track.style.transform = `translateX(${targetX}px)`;
        }, 50);

        // Завершення прокрутки
        setTimeout(() => {
            resultText.innerText = `Ви виграли: ${winningItem.name} (${winningItem.price} 🪙)!`;
            inventory.push({ ...winningItem, id: Date.now() });
            updateUI();

            // Закриваємо вікно через 2 секунди
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 2000);
        }, 4200);
    }

    // Відображення інвентарю
    function renderInventory() {
        const list = document.getElementById('inventory-list');
        if (inventory.length === 0) {
            list.innerHTML = `<p style="color: #94a3b8; grid-column: span 2; text-align: center; padding: 20px;">Інвентар порожній. Відкрийте свій перший кейс!</p>`;
            return;
        }

        list.innerHTML = inventory.map((item, index) => `
            <div class="inventory-item" style="border-color: ${item.color}">
                <span style="font-size: 32px;">${item.icon}</span>
                <div class="item-name" style="color: ${item.color}">${item.name}</div>
                <div style="font-size: 12px; color: #94a3b8;">Ціна: ${item.price} 🪙</div>
                <button class="sell-btn" onclick="sellItem(${index})">Продати</button>
            </div>
        `).join('');
    }

    // Продаж предмета з інвентарю
    function sellItem(index) {
        money += inventory[index].price;
        inventory.splice(index, 1);
        updateUI();
    }

    // Перший запуск
    updateUI();
</script>

</body>
</html>
